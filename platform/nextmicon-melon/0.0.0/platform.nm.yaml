scripts:
  linux: &id001
    synth:
      note: Build complete RTL using the native NextMicon OSS FPGA builder
      cmd: micon fpga build --board melon --top top --source hardware/top.v --out
        build/fpga
      src:
      - hardware/top.v
      out:
      - build/fpga/hardware.bit
    blink:
      note: Build the supplied board example
      cmd: micon fpga build --board melon --source platform/hardware/blink.v --out
        build/blink
      src:
      - platform/hardware/blink.v
      out:
      - build/blink/hardware.bit
    program:
      note: Load FPGA SRAM through an explicitly selected external JTAG cable
      cmd: ': "${JTAG_CABLE:?Set JTAG_CABLE to your external probe}"

        micon fpga program --board melon --cable "$JTAG_CABLE" --bitstream build/fpga/hardware.bit'
      src:
      - build/fpga/hardware.bit
    bootloader:
      note: Build USB recovery image (default USB ID is private-testing only)
      cmd: micon fpga bootloader --board melon --out build/bootloader
      out:
      - build/bootloader/hardware.bit
      - build/bootloader/bootloader.json
    install_bootloader:
      note: One-time external JTAG installation of recovery into SPI flash
      cmd: ': "${JTAG_CABLE:?Set JTAG_CABLE to your external probe}"

        micon fpga install-bootloader --board melon --cable "$JTAG_CABLE" --bitstream
        build/bootloader/hardware.bit'
      src:
      - build/bootloader/hardware.bit
      - build/bootloader/bootloader.json
    usb:
      note: Persist and verify the user image over USB-C CDC; enter recovery first
      cmd: ': "${USB_PORT:?Set USB_PORT to the recovery CDC serial port}"

        micon fpga usb --board melon --port "$USB_PORT" --bitstream build/fpga/hardware.bit'
      src:
      - build/fpga/hardware.bit
    flash:
      note: Persist the user slot through external JTAG; install recovery first
      cmd: ': "${JTAG_CABLE:?Set JTAG_CABLE to your external probe}"

        micon fpga program --board melon --flash --cable "$JTAG_CABLE" --bitstream
        build/fpga/hardware.bit'
      src:
      - build/fpga/hardware.bit
  macos: *id001
  windows: {}
