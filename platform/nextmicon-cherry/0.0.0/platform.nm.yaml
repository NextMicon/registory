scripts:
  linux: &id001
    synth:
      note: Build complete RTL using the native NextMicon OSS FPGA builder
      cmd: micon fpga build --board cherry --top top --source hardware/top.v --out
        build/fpga
      src:
      - hardware/top.v
      out:
      - build/fpga/hardware.bin
    blink:
      note: Build the supplied board example
      cmd: micon fpga build --board cherry --source platform/hardware/blink.v --out
        build/blink
      src:
      - platform/hardware/blink.v
      out:
      - build/blink/hardware.bin
  macos: *id001
  windows: {}
